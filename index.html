<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oréal | Smart Routine &amp; Product Advisor</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&family=Noto+Sans+Arabic:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <!------- Language switch (LevelUp: RTL support) ------->
      <div class="language-bar">
        <label for="languageSelect" data-i18n="language">Language</label>
        <select id="languageSelect">
          <option value="en">English</option>
          <option value="ar">العربية</option>
        </select>
      </div>

      <!------- Header / Branding ------->
      <header class="site-header">
        <img src="img/loreal-logo.png" alt="L'Oréal Logo" class="logo" />
        <h1 class="site-title" data-i18n="title">Smart Routine &amp; Product Advisor</h1>
        <span class="title-accent" aria-hidden="true"></span>
      </header>

      <!-- Product search + category filter (LevelUp: product search) -->
      <div class="search-section">
        <label for="productSearch" class="visually-hidden" data-i18n="searchLabel">Search products</label>
        <input
          id="productSearch"
          type="search"
          placeholder="Search products by name or keyword…"
          data-i18n-placeholder="searchPlaceholder"
          autocomplete="off"
        />
        <label for="categoryFilter" class="visually-hidden" data-i18n="categoryLabel">Category</label>
        <select id="categoryFilter">
          <option value="" data-i18n="allCategories">All Categories</option>
          <option value="cleanser" data-i18n="cat_cleanser">Cleansers</option>
          <option value="moisturizer" data-i18n="cat_moisturizer">Moisturizers &amp; Treatments</option>
          <option value="skincare" data-i18n="cat_skincare">Skincare &amp; Serums</option>
          <option value="haircare" data-i18n="cat_haircare">Haircare</option>
          <option value="makeup" data-i18n="cat_makeup">Makeup</option>
          <option value="hair color" data-i18n="cat_hairColor">Hair Color</option>
          <option value="hair styling" data-i18n="cat_hairStyling">Hair Styling</option>
          <option value="men's grooming" data-i18n="cat_mensGrooming">Men's Grooming</option>
          <option value="suncare" data-i18n="cat_suncare">Suncare</option>
          <option value="fragrance" data-i18n="cat_fragrance">Fragrance</option>
        </select>
      </div>

      <!-- Products Grid -->
      <div id="productsContainer" class="products-grid" aria-live="polite"></div>

      <!-- Selected Products -->
      <div class="selected-products">
        <div class="selected-header">
          <h2 data-i18n="selectedHeading">Selected Products</h2>
          <button type="button" id="clearSelections" class="clear-btn" data-i18n="clearAll">Clear all</button>
        </div>
        <div id="selectedProductsList"></div>
        <button id="generateRoutine" class="generate-btn">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span data-i18n="generate">Generate Routine</span>
        </button>
      </div>

      <!------- Chat Area ------->
      <section class="chatbox">
        <h2 data-i18n="chatHeading">Let's Build Your Routine</h2>
        <div id="chatWindow" class="chat-window" aria-live="polite"></div>

        <form id="chatForm" class="chat-form">
          <label for="userInput" class="visually-hidden" data-i18n="messageLabel">Message</label>
          <input
            id="userInput"
            name="userInput"
            type="text"
            placeholder="Ask me about products or routines…"
            data-i18n-placeholder="chatPlaceholder"
            autocomplete="off"
            required
          />
          <button type="submit" id="sendBtn">
            <i class="fa-solid fa-paper-plane"></i>
            <span class="visually-hidden" data-i18n="send">Send</span>
          </button>
        </form>
      </section>

      <!------- Footer Links ------->
      <footer class="site-footer">
        <p data-i18n="rights">&copy; 2025 L'Oréal. All rights reserved.</p>
        <nav>
          <!-- These URLs are placeholders -->
          <a href="#" data-i18n="privacy">Privacy Policy</a>
          <a href="#" data-i18n="terms">Terms of Use</a>
          <a href="#" data-i18n="contact">Contact</a>
        </nav>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
